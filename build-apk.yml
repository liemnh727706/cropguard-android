name: Build CropGuard APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Debug - show actual MainActivity.kt around line 292
        run: |
          echo "=== File info ==="
          file app/src/main/java/com/cropguard/app/MainActivity.kt
          wc -l app/src/main/java/com/cropguard/app/MainActivity.kt
          echo "=== Lines 285-300 ==="
          sed -n '285,300p' app/src/main/java/com/cropguard/app/MainActivity.kt
          echo "=== Git commit info ==="
          git log -1 --oneline
          git rev-parse HEAD

      - name: Clean build cache
        run: ./gradlew clean --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --no-build-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cropguard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
